[project]
name = "sema"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jessica Millar", email = "jessica.lynn.millar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
]

[project.scripts]
sema = "sema.interfaces.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sema"]

[tool.pytest.ini_options]
norecursedirs = ["output"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ipython>=9.12.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mypy>=1.16.1",
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

[tool.pyright]
include = ["src", "tests"]
# The generated runtime is excluded until OPS-651 makes the generator's
# output pyright-clean; its gate is snapshot_lint (ruff + mypy).
exclude = ["src/sema/runtime"]
