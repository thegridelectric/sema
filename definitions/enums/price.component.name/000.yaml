$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/price.component.name/000"

title: "price.component.name"
type: "string"
description: >
  The named parts a market price divides into. A MarketMaker's price for a
  slot is the full price a bidder faces at the maker's node; each part is
  the amount of that price owed to one cause, and the parts sum to the
  price. Naming the parts lets each one settle with its own counterparty
  while the contract stays on the one price.

enum:
  - "Unknown"
  - "WholesaleEnergy"
  - "WholesaleCongestion"
  - "WholesaleLoss"
  - "Delivery"
  - "CoincidentPeakTransmission"
  - "CoincidentPeakCapacity"

default: "Unknown"

x-gridworks:
  owner: "gridworks-energy"
  version: "000"
  value_descriptions:
    "Unknown": "A part this version of the enum cannot name. Its amount still counts toward the price."
    "WholesaleEnergy": "The energy component of the wholesale locational marginal price at the pricing point the MarketMaker faces."
    "WholesaleCongestion": "The congestion component of that wholesale locational marginal price. It is negative behind an export constraint."
    "WholesaleLoss": "The marginal loss component of that wholesale locational marginal price."
    "Delivery": "What the distribution utility bills per unit of energy for delivery under the tariff the market declares."
    "CoincidentPeakTransmission": "The expected cost of the transmission charge that is allocated by load at the monthly coincident peak, assigned to the slot from the probability that the slot is that peak."
    "CoincidentPeakCapacity": "The expected cost of the capacity charge that is allocated by load at the annual coincident peak, assigned to the slot from the probability that the slot is that peak."
