$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/enums/zone.emitter.type/000"

title: "zone.emitter.type"
type: "string"
description: >
  Type of emitter a zone-call circuit drives.

enum:
  - "Unknown"
  - "FinTube"
  - "CastIronBaseboard"
  - "CastIronRadiator"
  - "FanCoil"
  - "RadiantSlab"
  - "StoreUnderFloor"

default: "Unknown"

x-gridworks:
  owner: "gridworks-energy"
  version: "000"
  value_descriptions:
    "Unknown": >
      The value a decoder takes for an emitter type this version does not
      declare. Do not act on it.

    "FinTube": >
      Copper tube with aluminium fins in a baseboard enclosure. Low thermal
      mass.

    "CastIronBaseboard": >
      A cast iron baseboard element. Heavier than fin tube, so it holds
      heat longer.

    "CastIronRadiator": >
      A free-standing cast iron radiator. The heaviest of the water
      emitters.

    "FanCoil": >
      A coil with a fan moving room air across it. Heats and cools.

    "RadiantSlab": >
      Tubing embedded in a floor slab. Hours of thermal mass.

    "StoreUnderFloor": >
      A cement thermal store under the floor, charged as the house's heat
      storage and discharging into the room through the slab above it.
