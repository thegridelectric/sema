$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.create.cmd/001"

title: "gw.weather.create.cmd"
type: object
description: >
  Command to create a single weather record — the human minting act by
  which a location, observed channel, forecast channel, forecast
  bundle, or seasonal template enters the weather service. One record
  per command, references first: a record's references must already be
  active when the command arrives (location before its channels and
  its template, channels before the bundle that embeds them). The
  service validates the record, inserts it (insert-only — records are
  durable identities, never upserted), broadcasts it once, and replies
  direct to the sender.

properties:

  Record:
    description: >
      The record entering the service — one of the five weather record
      words, discriminated by its own TypeName.
    oneOf:
      - $ref: "https://schemas.electricity.works/types/gw.weather.channel.gt/000"
      - $ref: "https://schemas.electricity.works/types/gw.weather.forecast.bundle.gt/000"
      - $ref: "https://schemas.electricity.works/types/gw.weather.forecast.channel.gt/000"
      - $ref: "https://schemas.electricity.works/types/gw.weather.location.gt/000"
      - $ref: "https://schemas.electricity.works/types/gw.weather.seasonal.template.gt/000"

  Proof:
    type: string
    description: >
      Optional placeholder for a verifiable authorization artifact for
      this create. Its format is machinery of the authority substrate and
      is deliberately not fixed by this word; absent while write
      authority is the authenticated connection.

  TypeName:
    const: "gw.weather.create.cmd"

  Version:
    const: "001"

required:
  - Record
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "Record": {
        "LocationAlias": "us.me.millinocket",
        "TempByMonth": [-300, -700, 100, 2100, 3000, 3100, 4600, 4700, 2800, 2400, 1600, 0],
        "Start": "2026-10-07T00:00:00Z",
        "Id": "3b7c1e52-8d4a-4f6e-9c2b-5a1d8e7f0c93",
        "TypeName": "gw.weather.seasonal.template.gt",
        "Version": "000"
      },
      "TypeName": "gw.weather.create.cmd",
      "Version": "001"
    }

x-gridworks:
  owner: "gridworks-energy"

  extended_description: >
    The command, the reply, and the record broadcast all ride the bus,
    so the ear's capture holds the full provenance of every record's
    existence: who asked, the service's verdict, and the record itself.
    One command word covers every record kind because the act is the
    same — create a record; a further record kind extends the Record
    slot in a new version rather than coining another command word.
