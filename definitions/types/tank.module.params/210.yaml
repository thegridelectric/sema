$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/tank.module.params/210"

title: "tank.module.params"
type: object
description: >
  The params handshake between a tank-module pico and its scada. The pico
  posts its current parameters at boot; the scada answers with the same
  type carrying the values the pico should run with, including the
  capture offset that lines its synchronous reports up with the other
  picos in the house.

properties:
  HwUid:
    type: string
    description: >
      The pico's hardware id, derived from the chip's unique id.

  ActorNodeName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The name of the scada node this pico reports as.

  PicoAB:
    type: string
    description: >
      Which of a two-pico tank module this board is, a or b. Absent for a
      single-pico module.

  CapturePeriodS:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Seconds between synchronous microvolt reports.

  Samples:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      ADC samples taken per reading.

  NumSampleAverages:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Readings averaged into one reported value.

  AsyncCaptureDeltaMicroVolts:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Change in microvolts since the last report that triggers an
      asynchronous report.

  CaptureOffsetS:
    type: number
    description: >
      Seconds after the period boundary at which the pico takes its
      synchronous reading. Set by the scada in its answer; held in memory
      only, never persisted on the pico.

  PicoBoardVariant:
    $ref: "https://schemas.electricity.works/enums/pico.board.variant/000"
    description: >
      The physical board this pico runs on, as the firmware determines it
      at boot.

  MicropythonVersion:
    type: string
    description: >
      The MicroPython release the firmware is running on, read live from
      the interpreter at each post.

  FirmwareCommit:
    $ref: "https://schemas.electricity.works/formats/firmware.commit"
    description: >
      The gridworks-pico commit the firmware was generated from, stamped
      into the code by the provisioner generator.

  TypeName:
    const: "tank.module.params"

  Version:
    const: "210"

required:
  - HwUid
  - ActorNodeName
  - CapturePeriodS
  - Samples
  - NumSampleAverages
  - AsyncCaptureDeltaMicroVolts
  - PicoBoardVariant
  - MicropythonVersion
  - FirmwareCommit
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "HwUid": "pico_1a2b3c",
      "ActorNodeName": "buffer",
      "CapturePeriodS": 60,
      "Samples": 1000,
      "NumSampleAverages": 10,
      "AsyncCaptureDeltaMicroVolts": 2000,
      "PicoBoardVariant": "PicoRaspberryWifi2040",
      "MicropythonVersion": "1.24.1",
      "FirmwareCommit": "9f4c1d2e7a8b0c3d5e6f70819a2b3c4d5e6f7081",
      "TypeName": "tank.module.params",
      "Version": "210"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "PicoABIsAOrB"
      statement: >
        If PicoAB is present it SHALL be "a" or "b".
