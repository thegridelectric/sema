$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/flo.rerun.request/000"

title: "flo.rerun.request"
type: object
description: >
  Request to re-solve one market slot: the flo.params (possibly edited), 
  and which horizon steps force the heat pump on or off.

properties:
  Params:
    oneOf:
      - $ref: "https://schemas.electricity.works/types/flo.params/001"
      - $ref: "https://schemas.electricity.works/types/flo.params/002"
    description: >
      The requested parameters for the slot: the journaled flo.params, 
      possibly with some parameter values edited.
  HpForcedOnSteps:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Horizon steps where the heat pump is forced on.
      0 is the first step.
  HpForcedOffSteps:
    type: array
    items:
      $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Horizon steps where the heat pump is forced off.
      0 is the first step.
  TypeName:
    const: "flo.rerun.request"
  Version:
    const: "000"

required:
  - Params
  - HpForcedOnSteps
  - HpForcedOffSteps
  - TypeName
  - Version

additionalProperties: false

