x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "ForcedStepsWithinHorizon"
      statement: >
        Each element of HpForcedOnSteps and HpForcedOffSteps SHALL be an
        integer in the half-open range from 0 up to but not including the
        length of Params.StepDurationMinutes.
    - number: 2
      name: "ForcedOnOffDisjoint"
      statement: >
        No step index SHALL appear in both HpForcedOnSteps and
        HpForcedOffSteps.