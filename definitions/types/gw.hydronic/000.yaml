$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.hydronic/000"

title: "gw.hydronic"
type: object
description: >
  The hydronic / flow-topology configuration of a hydronic space-heating
  layout (House0 and Nolan strategies alike): its zones, zone-call
  circuits, store-tank count, and how primary-loop flow is obtained. The
  measured-vs-derived "primary-flow" choice is a
  physical-topology fact carried here so the layout states it rather than it
  being inferred from channel presence.

properties:
  Zones:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw1.hvac.zone/000"
    description: >
      The heating zones in order; the 1-based position of each is its zone
      index. Replaces the former parallel ZoneList / CriticalZoneList /
      ZoneKwhPerDegFList (their subset / equal-length invariants are now
      structural).

  ZoneCallCircuits:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw1.zone.call.circuit/000"
    description: >
      The zone-call circuits, each binding a wall thermostat, call wire,
      relay pair, and actuator to the zone it serves. A zone may be served
      by more than one circuit.

  TotalStoreTanks:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Number of thermal-storage tanks (buffer excluded); zero for a layout
      whose store is not water tanks. At most 6 (the Cardinality axiom).

  PrimaryFlowSource:
    $ref: "https://schemas.electricity.works/enums/gw.primary.flow.source/000"
    description: >
      Whether "primary-flow" is a measured DataChannel (a meter at the primary
      pump) or a derived sum over the Siegenthaler loop sensors.

  HpCommandNodeName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The ShNode that takes heat-pump commands under hp-boss: hp-odu when
      the outdoor unit speaks the wire protocol natively, hp-idu or
      hp-ctrl-box when its box does. Absent when nothing commands the heat
      pump (hp-boss dormant). Governed by the layout word's
      CommandableHeatPump axiom.

  TypeName:
    const: "gw.hydronic"

  Version:
    const: "000"

required:
  - Zones
  - ZoneCallCircuits
  - TotalStoreTanks
  - PrimaryFlowSource
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "Zones": [
        {"Name": "down", "Critical": true, "KwhPerDegF": 1, "TempChannelName": "zone1-down-temp", "TypeName": "gw1.hvac.zone", "Version": "000"},
        {"Name": "up", "Critical": true, "KwhPerDegF": 0, "TempChannelName": "zone2-up-temp", "TypeName": "gw1.hvac.zone", "Version": "000"}
      ],
      "ZoneCallCircuits": [
        {
          "CircuitPosition": 1,
          "ServesZone": "down",
          "ActuatorKind": "FloorLoop",
          "Role": "Baseload",
          "CanCool": false,
          "SetpointSource": "Learned",
          "Thermostat": {"Kind": "MechanicalDial", "TypeName": "gw1.zone.thermostat", "Version": "000"},
          "WhitewireChannelName": "zone1-down-opto-input",
          "FailsafeRelayNode": "zone1-down-failsafe-relay",
          "OpsRelayNode": "zone1-down-ops-relay",
          "TypeName": "gw1.zone.call.circuit",
          "Version": "000"
        }
      ],
      "TotalStoreTanks": 3,
      "PrimaryFlowSource": "Measured",
      "TypeName": "gw.hydronic",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"
  axioms:
    - number: 1
      name: "Cardinality"
      statement: >
        a. TotalStoreTanks SHALL be at most 6.
        b. The number of Zones SHALL be between 1 and 6 inclusive.
    - number: 2
      name: "CircuitResolution"
      statement: >
        a. Every circuit's ServesZone SHALL equal the Name of a zone in
        Zones. b. No two circuits SHALL share a CircuitPosition.
    - number: 3
      name: "LearnedNeedsTempChannel"
      statement: >
        For every circuit whose SetpointSource is Learned, the zone named
        by its ServesZone SHALL carry a TempChannelName.
