x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "SharedSliceGrid"
      statement: >
        TempForecastChannel, WindSpeedForecastChannel and
        IrradianceForecastChannel SHALL declare identical
        SliceDurationSList.
    - number: 2
      name: "EmitOffsetBound"
      statement: >
        EmitOffsetS SHALL be strictly less than EmitPeriodS.
    - number: 3
      name: "DistinctChannels"
      statement: >
        TempForecastChannel.Name, WindSpeedForecastChannel.Name and
        IrradianceForecastChannel.Name SHALL be pairwise distinct.
    - number: 4
      name: "TargetBinding"
      statement: >
        TempForecastChannel.TargetChannelName SHALL equal
        TempObservationChannel.Name, WindSpeedForecastChannel.TargetChannelName
        SHALL equal WindSpeedObservationChannel.Name, and
        IrradianceForecastChannel.TargetChannelName SHALL equal
        IrradianceObservationChannel.Name.
    - number: 5
      name: "QuantityTargeting"
      statement: >
        TempObservationChannel.Quantity SHALL be Temperature,
        WindSpeedObservationChannel.Quantity SHALL be WindSpeed, and
        IrradianceObservationChannel.Quantity SHALL be Irradiance.
    - number: 6
      name: "LocationConsistency"
      statement: >
        TempObservationChannel.LocationAlias,
        WindSpeedObservationChannel.LocationAlias and
        IrradianceObservationChannel.LocationAlias SHALL equal
        LocationAlias.
    - number: 7
      name: "ForecastNaming"
      statement: >
        Name SHALL equal LocationAlias + ".forecast." followed by one
        or more further segments.

  extended_description: >
    The bundle is the sign-up object: a record fetched rarely (seed,
    record listing), never carted per-message — each
    gw.weather.forecast carries only BundleName as the join key.
    Embedding the forecast channels AND their observed targets makes
    every cross-channel fact — shared grid, shared schedule, target
    binding, quantity targeting, location consistency — verifiable
    from the instance alone, and ties the forecast stream to its
    observation stream explicitly: the bundle Name extends
    LocationAlias, which names the observation broadcasts for the
    same place. The weather forecast service additionally enforces
    the embedded copies' agreement with its canonical channel records
    at seed/boot time.
