x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "NonEmptyBindings"
      statement: >
        BindingList SHALL be non-empty.
    - number: 2
      name: "SharedSliceGrid"
      statement: >
        Every ForecastChannel in BindingList SHALL declare identical
        SliceDurationSList.
    - number: 3
      name: "EmitOffsetBound"
      statement: >
        EmitOffsetS SHALL be strictly less than EmitPeriodS.
    - number: 4
      name: "DistinctChannels"
      statement: >
        ForecastChannel.Name SHALL be distinct across BindingList.
    - number: 5
      name: "DistinctQuantities"
      statement: >
        ObservationChannel.Quantity SHALL be distinct across
        BindingList.
    - number: 6
      name: "LocationConsistency"
      statement: >
        Every ObservationChannel.LocationAlias in BindingList SHALL
        equal LocationAlias.
    - number: 7
      name: "ForecastNaming"
      statement: >
        Name SHALL equal LocationAlias + ".forecast." followed by one
        or more further segments.

  extended_description: >
    The bundle is the sign-up object: a record fetched rarely (seed,
    record listing), never carted per-message — each
    gw.weather.forecast carries only BundleName as the join key.
    Embedding each forecast channel with its observed target makes
    every cross-channel fact — shared grid, shared schedule, target
    binding, one series per quantity, location consistency —
    verifiable from the instance alone, and ties the forecast stream
    to its observation stream explicitly: the bundle Name extends
    LocationAlias, which names the observation broadcasts for the
    same place. The Name is a handle, not a description: it does not
    encode which quantities or forecasters the bundle holds, so a
    bundle keeps its name across the records that serve it. The
    weather forecast service additionally enforces the embedded
    copies' agreement with its canonical channel records at
    seed/boot time, and emits exactly the series the bundle binds.
