$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.weather.forecast.bundle.gt/002"

title: "gw.weather.forecast.bundle.gt"
type: object
description: >
  A curated, subscribable set of forecast channels sharing one
  time-slice grid and one emission schedule, together with the
  observed channels they target — the unit a consumer designates and
  receives. The bundle declares which series its gw.weather.forecast
  broadcasts hold, one per quantity. The GridWorks-run weather
  forecast service emits one gw.weather.forecast per bundle per
  emission slot. `.gt`: coupled with the weather service's database,
  which is the canonical seed.

properties:
  Name:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The stream name consumers subscribe to for this bundle's
      gw.weather.forecast broadcasts, carried on each message as
      BundleName. Equals LocationAlias + ".forecast." + a slug.

  DisplayName:
    $ref: "https://schemas.electricity.works/formats/non.empty.string"
    description: >
      Human-readable name for the bundle.

  LocationAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      Alias of the gw.weather.location.gt whose weather this bundle
      forecasts. The observation stream for the same place is named
      by this alias.

  BindingList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/gw.weather.forecast.binding/000"
    description: >
      The forecast channels this bundle serves, each with the observed
      channel it targets; one per quantity.

  EmitPeriodS:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Seconds between scheduled forecast emissions for this bundle.
      The service always emits on schedule; a missing message means a
      drop.

  EmitOffsetS:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Offset into the emission period of each scheduled emission (60
      with EmitPeriodS 3600 is the :01 broadcast).

  Start:
    $ref: "https://schemas.electricity.works/formats/utc.iso8601.seconds"
    description: >
      Validity start, so an archived message resolves against the
      bundle active at its time.

  Id:
    $ref: "https://schemas.electricity.works/formats/uuid4.str"
    description: >
      Immutable identity of this bundle record. Changing any
      structural fact is a new record, never a mutation.

  TypeName:
    const: "gw.weather.forecast.bundle.gt"

  Version:
    const: "002"

required:
  - Name
  - DisplayName
  - LocationAlias
  - BindingList
  - EmitPeriodS
  - EmitOffsetS
  - Start
  - Id
  - TypeName
  - Version

additionalProperties: false

