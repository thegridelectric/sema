$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/flow.reed.params/101"

title: "flow.reed.params"
type: object
description: >
  The params handshake between a reed-switch flow pico and its scada. The
  pico posts its current parameters at boot; the scada answers with the same
  type carrying the values the pico should run with.

properties:
  HwUid:
    type: string
    description: >
      The pico's hardware id, derived from the chip's unique id.

  ActorNodeName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The name of the scada node this pico reports as.

  FlowNodeName:
    $ref: "https://schemas.electricity.works/formats/spaceheat.name"
    description: >
      The name of the flow node whose ticks this pico reports.

  PublishTicklistLength:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Number of ticks that fills a ticklist and triggers a post.

  PublishAnyTicklistAfterS:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Seconds after which a partial ticklist is posted anyway.

  DeadbandMilliseconds:
    type: integer
    description: >
      Milliseconds after a tick during which further edges are ignored as
      reed-switch bounce.

  TypeName:
    const: "flow.reed.params"

  Version:
    const: "101"

required:
  - HwUid
  - ActorNodeName
  - FlowNodeName
  - PublishTicklistLength
  - PublishAnyTicklistAfterS
  - DeadbandMilliseconds
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "HwUid": "pico_1a2b3c",
      "ActorNodeName": "dist-flow",
      "FlowNodeName": "dist-flow",
      "PublishTicklistLength": 10,
      "PublishAnyTicklistAfterS": 60,
      "DeadbandMilliseconds": 50,
      "TypeName": "flow.reed.params",
      "Version": "101"
    }

x-gridworks:
  owner: "gridworks-energy"
