$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://schemas.electricity.works/types/gw.operational.params/000"

title: "gw.operational.params"
type: object
description: >
  Operational and optimization parameters for one home — the tunable state
  that changes without rewiring hardware. The third SCADA artifact alongside
  deployment config and the static hardware layout.

  The fields every layout family tunes live here: the per-channel capture
  tuning, the 0-10V power-on levels, actuation authority and service mode
  (authority dominates: ServiceMode is inert unless ActuationAuthority is
  Active), the COP and heating curves, the heat-pump and load-estimation
  knobs, the FLO horizon, and the tariff. The knobs that presume a feature of
  the layout (a buffer, a store, a Siegenthaler loop) live in FamilyParams,
  whose TypeName names the layout family; the consumer decodes FamilyParams
  through the paired layout's family, so a mismatched pair fails at decode.

properties:
  ScadaAlias:
    $ref: "https://schemas.electricity.works/formats/left.right.dot"
    description: >
      The alias of the Scada GNode that applies these params, making a stored
      or emitted instance self-identifying. The layout is the registry of
      record for the full GNode; the consumer checks this alias names the
      paired layout's Scada.

  FamilyParams:
    oneOf:
      - $ref: "https://schemas.electricity.works/types/gw.house0.family.params/000"
      - $ref: "https://schemas.electricity.works/types/gw.nolan.family.params/000"
    description: >
      The layout-family block: the knobs that only mean something against a
      layout of that family. Its TypeName is the family.

  CaptureTuningList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/capture.tuning/000"
    description: >
      Per-channel capture/report tuning, one entry per captured channel.

  ZeroTenPowerOnList:
    type: array
    items:
      $ref: "https://schemas.electricity.works/types/zero.ten.power.on/000"
    description: >
      The power-on level of each 0-10V output, one entry per output node.

  ActuationAuthority:
    $ref: "https://schemas.electricity.works/enums/gw1.actuation.authority/000"
    description: >
      The degree of physical actuation authority SCADA exercises. Authority
      dominates: ServiceMode is inert unless ActuationAuthority is Active.

  ServiceMode:
    $ref: "https://schemas.electricity.works/enums/gw1.service.mode/000"
    description: >
      The thermal service provided while ActuationAuthority is Active;
      inert otherwise.

  CopCurve:
    $ref: "https://schemas.electricity.works/types/cop.curve/000"
    description: >
      The heat pump's coefficient-of-performance model.

  HeatingCurve:
    $ref: "https://schemas.electricity.works/types/heating.curve/000"
    description: >
      The house's thermal / required-source-water-temperature model.

  HpTurnOnMinutes:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      Minutes the heat pump takes to reach steady output after turn-on.

  HpMaxKwEl:
    $ref: "https://schemas.electricity.works/formats/positive.float"
    description: >
      The heat pump's maximum electrical draw, in kW.

  LoadOverestimationPercent:
    $ref: "https://schemas.electricity.works/formats/non.negative.int"
    description: >
      Percentage by which forecast heat load is deliberately overestimated.

  OilBoilerBackup:
    type: boolean
    description: >
      Whether the home has an oil boiler available as backup heat.

  HorizonHours:
    $ref: "https://schemas.electricity.works/formats/positive.int"
    description: >
      The FLO optimization horizon, in hours.

  Tariff:
    $ref: "https://schemas.electricity.works/types/gw.tou.tariff/000"
    description: >
      The time-of-use tariff the home is billed on: its clock and the on-peak
      windows during which the heat pump is held off.

  TypeName:
    const: "gw.operational.params"

  Version:
    const: "000"

required:
  - ScadaAlias
  - FamilyParams
  - CaptureTuningList
  - ZeroTenPowerOnList
  - ActuationAuthority
  - ServiceMode
  - CopCurve
  - HeatingCurve
  - HpTurnOnMinutes
  - HpMaxKwEl
  - LoadOverestimationPercent
  - OilBoilerBackup
  - HorizonHours
  - Tariff
  - TypeName
  - Version

additionalProperties: false

examples:
  - |
    {
      "ScadaAlias": "hw1.isone.me.versant.keene.beech.scada",
      "FamilyParams": {
        "UseSiegLoop": true,
        "KeepBufferFull": false,
        "SeasonalStorageMode": "AllTanks",
        "TypeName": "gw.house0.family.params",
        "Version": "000"
      },
      "CaptureTuningList": [
        {
          "ChannelName": "dist-swt",
          "CapturePeriodS": 300,
          "AsyncCapture": true,
          "AsyncCaptureDelta": 250,
          "TypeName": "capture.tuning",
          "Version": "000"
        }
      ],
      "ZeroTenPowerOnList": [
        {
          "NodeName": "dist-010v",
          "PowerOnVoltsTimesTen": 20,
          "TypeName": "zero.ten.power.on",
          "Version": "000"
        }
      ],
      "ActuationAuthority": "Active",
      "ServiceMode": "Heating",
      "CopCurve": {
        "Intercept": 1.02,
        "OatCoeff": 0.0257,
        "LwtCoeff": 0,
        "Min": 1.4,
        "MinOatF": 15,
        "TypeName": "cop.curve",
        "Version": "000"
      },
      "HeatingCurve": {
        "AlphaTimes10": 55,
        "BetaTimes100": -10,
        "GammaEx6": 0,
        "IntermediatePowerKw": 1.5,
        "IntermediateRswtF": 100,
        "DdPowerKw": 5.5,
        "DdRswtF": 150,
        "DdDeltaTF": 20,
        "MaxEwtF": 170,
        "TypeName": "heating.curve",
        "Version": "000"
      },
      "HpTurnOnMinutes": 12,
      "HpMaxKwEl": 9.66,
      "LoadOverestimationPercent": 0,
      "OilBoilerBackup": true,
      "HorizonHours": 48,
      "Tariff": {
        "Alias": "versant.a1.home.eco.bonus",
        "DisplayName": "Home Eco Rate with Bonus Meter",
        "TimezoneStr": "America/New_York",
        "OnPeakWindows": [
            {
              "Start": "07:00",
              "End": "12:00",
              "Days": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
              "TypeName": "gw.tou.window",
              "Version": "000"
            }
        ],
        "TypeName": "gw.tou.tariff",
        "Version": "000"
      },
      "TypeName": "gw.operational.params",
      "Version": "000"
    }

x-gridworks:
  owner: "gridworks-energy"

  axioms:
    - number: 1
      name: "CaptureTuningChannelUniqueness"
      statement: >
        ChannelName SHALL be unique across CaptureTuningList.

    - number: 2
      name: "ZeroTenPowerOnNodeUniqueness"
      statement: >
        NodeName SHALL be unique across ZeroTenPowerOnList.

  extended_description: >
    operational-params is the authored home for the tunable state that left the
    static hardware layout and the deployment config: what changes without
    rewiring hardware. Home identity (the GNodes) lives in the layout. The
    assembly step merges this artifact with the static layout to build the
    runtime layout the device actors read, so the actors see one layout.
